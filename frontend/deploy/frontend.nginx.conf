# nginx fronts the whole web node: it serves the built Vue SPA as static
# files and hands the API paths to gunicorn. Serving both from one origin is
# what lets the frontend work unmodified -- src/api.js has a hardcoded
# baseURL of http://localhost:8000, so the SPA and the API it calls have to
# answer on the same host and port that the browser loaded the page from.
server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    # Built by provisions/web.sh out of a guest-local copy of the source,
    # never from /vagrant -- see the rsync comment in that script.
    root /opt/web/frontend/dist;
    index index.html;

    # The SPA's bundle is hashed per build; index.html must not be cached or
    # a reprovision serves a stale document referencing deleted assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # collectstatic output -- admin CSS and DRF's browsable API. Django does
    # not serve these itself with DEBUG=False.
    location /static/ {
        alias /vagrant/web/backend/staticfiles/;
        access_log off;
    }

    # Django owns exactly these three prefixes (see web/backend/config/urls.py).
    location /api/   { proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params_web; }
    location /auth/  { proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params_web; }
    location /admin/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/proxy_params_web; }

    # Everything else is a client-side route (vue-router is in history mode),
    # so a hard refresh on /today has to return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
