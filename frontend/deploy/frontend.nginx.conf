# nginx on the frontend VM serves the built Vue SPA as static files and
# proxies every API path to gunicorn on the backend VM (192.168.56.11:8000).
# Serving both from one origin is what lets the frontend work with no
# hardcoded host -- src/api.js's baseURL is "" (the page's own origin), so
# the SPA and the API it calls always answer on whatever host and port the
# browser actually loaded the page from, including an auto-corrected host
# port (see the Vagrantfile).
upstream backend {
    server 192.168.56.11:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Built by provisions/frontend.sh out of a guest-local copy of the
    # source, never from /vagrant -- see the rsync comment in that script.
    root /opt/frontend/dist;
    index index.html;

    # The SPA's bundle is hashed per build; index.html must not be cached or
    # a reprovision serves a stale document referencing deleted assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Django owns exactly these four prefixes (see backend/config/urls.py
    # for three of them; /static/ is WhiteNoise, inside the same gunicorn
    # process -- there is no nginx alias into the backend VM's filesystem,
    # since that filesystem is on a different VM).
    location /api/    { proxy_pass http://backend; include /etc/nginx/proxy_params_backend; }
    location /auth/   { proxy_pass http://backend; include /etc/nginx/proxy_params_backend; }
    location /admin/  { proxy_pass http://backend; include /etc/nginx/proxy_params_backend; }
    location /static/ { proxy_pass http://backend; include /etc/nginx/proxy_params_backend; }

    # Everything else is a client-side route (vue-router is in history mode),
    # so a hard refresh on /today has to return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
